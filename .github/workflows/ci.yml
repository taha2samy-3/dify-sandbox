name: Build, Bake, Sign & Publish Dify Sandbox

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Specific image tag (e.g. 0.2.15-v1.0.0). MUST NOT be "latest".'
        required: false
        default: ''
      python_packages:
        description: 'Override/Additional Python packages'
        required: false
        default: ''
      node_packages:
        description: 'Override/Additional Node.js packages'
        required: false
        default: ''
      push:
        description: 'Push to GHCR and sign'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  DIFY_SANDBOX_STABLE_VERSION: "0.2.15"

jobs:
  build-and-publish:
    name: Build, Cache, Sign & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Image Tags & Version
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_NAME="dify-sandbox"
          IMAGE_PATH="${{ env.REGISTRY }}/${OWNER}/${IMAGE_NAME}"
          DIFY_VER="${{ env.DIFY_SANDBOX_STABLE_VERSION }}"

          # Determine version tag (strictly NO "latest")
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${DIFY_VER}-${RAW_TAG}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${DIFY_VER}-sha-${SHORT_SHA}"
          fi

          # Safety check: enforce no "latest" tag
          if [[ "$VERSION" == *"latest"* ]]; then
            echo "::error::Tag 'latest' is strictly prohibited. Pinned tags are required."
            exit 1
          fi

          echo "image_path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          
          echo "Target Image: ${IMAGE_PATH}:${VERSION}"
          echo "Cache Backend: GitHub Actions Cache (type=gha)"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event.inputs.push != 'false')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Bake Overrides
        id: bake-overrides
        run: |
          SHOULD_PUSH="false"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event.inputs.push }}" != "false" ]; then
            SHOULD_PUSH="true"
          fi
          echo "push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"

      - name: Build and Push with Docker Buildx Bake
        id: bake
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: sandbox
          push: ${{ steps.bake-overrides.outputs.push }}
          set: |
            *.args.DIFY_SANDBOX_VERSION=${{ env.DIFY_SANDBOX_STABLE_VERSION }}
            *.args.PYTHON_PACKAGES=${{ github.event.inputs.python_packages }}
            *.args.NODE_PACKAGES=${{ github.event.inputs.node_packages }}
            *.tags=${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.version }}
            *.tags=${{ steps.meta.outputs.image_path }}:${{ env.DIFY_SANDBOX_STABLE_VERSION }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Extract Image Digest
        if: steps.bake-overrides.outputs.push == 'true'
        id: digest
        run: |
          # Query image digest from GHCR or inspect metadata
          IMAGE_REF="${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "$DIGEST" ] || [ "$DIGEST" == "null" ]; then
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF" | awk -F'@' '{print $2}')
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image Digest: ${DIGEST}"

      - name: Run Sandbox Verification Tests
        if: steps.bake-overrides.outputs.push == 'true'
        env:
          IMAGE_TAG: "${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.version }}"
          API_KEY: "dify-sandbox-ci-test-key"
        run: |
          echo "Pulling pushed image for validation: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          
          echo "Starting test container..."
          docker run -d \
            --name dify-sandbox-ci-test \
            --cap-add=SYS_CHROOT \
            --cap-add=CHOWN \
            --cap-add=SETUID \
            --cap-add=SETGID \
            -p 8194:8194 \
            -e API_KEY="$API_KEY" \
            -e GIN_MODE="release" \
            "$IMAGE_TAG"

          echo "Waiting for sandbox healthcheck..."
          for i in {1..30}; do
            if curl -sf http://localhost:8194/health >/dev/null 2>&1; then
              echo "Sandbox is healthy!"
              break
            fi
            sleep 1
          done

          echo "Running comprehensive test suite..."
          chmod +x scripts/comprehensive_tests.sh
          ./scripts/comprehensive_tests.sh 8194 "$API_KEY"

          echo "Cleaning up test container..."
          docker rm -f dify-sandbox-ci-test

      - name: Attest SLSA L3 Build Provenance
        if: steps.bake-overrides.outputs.push == 'true' && steps.digest.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image_path }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Sign Container Image (Cosign Keyless OIDC)
        if: steps.bake-overrides.outputs.push == 'true' && steps.digest.outputs.digest != ''
        env:
          IMAGE_URI: "${{ steps.meta.outputs.image_path }}@${{ steps.digest.outputs.digest }}"
        run: |
          echo "Signing image: $IMAGE_URI"
          cosign sign --yes "$IMAGE_URI"

      - name: Verify Image Signature
        if: steps.bake-overrides.outputs.push == 'true' && steps.digest.outputs.digest != ''
        env:
          IMAGE_URI: "${{ steps.meta.outputs.image_path }}@${{ steps.digest.outputs.digest }}"
        run: |
          echo "Verifying signature for $IMAGE_URI"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY_OWNER}/.*" \
            "$IMAGE_URI"
          echo "Signature successfully verified!"

      - name: Create GitHub Release
        if: steps.bake-overrides.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dify Sandbox Image ${GITHUB_REF_NAME}" \
            --generate-notes
