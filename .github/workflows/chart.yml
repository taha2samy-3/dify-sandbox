name: Package, Sign & Release Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - 'chart-v*.*.*'
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override chart version (e.g. 0.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/dify-sandbox
  CHART_NAME: dify-sandbox

jobs:
  lint-and-check:
    name: Lint & Template Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint Chart
        run: |
          helm lint "$CHART_DIR"

      - name: Render Template Test
        run: |
          helm template test-release "$CHART_DIR" > /dev/null

  release-chart:
    name: Package, Publish OCI & Sign Chart
    needs: lint-and-check
    if: startsWith(github.ref, 'refs/tags/chart-v') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Determine Chart Version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/chart-v* ]]; then
            VERSION="${GITHUB_REF_NAME#chart-v}"
          else
            VERSION="$(yq '.version' "$CHART_DIR/Chart.yaml")"
          fi

          CHART_FILE_VER="$(yq '.version' "$CHART_DIR/Chart.yaml")"
          if [[ "$VERSION" != "$CHART_FILE_VER" ]]; then
            echo "::error::Tag version ($VERSION) does not match Chart.yaml version ($CHART_FILE_VER)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Publish OCI Chart to GHCR
        id: push
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${{ env.REGISTRY }}/${OWNER}/charts"
          
          echo "Publishing to oci://$REPO ..."
          OUTPUT="$(helm push "dist/${CHART_NAME}-${{ steps.meta.outputs.version }}.tgz" "oci://$REPO" 2>&1)"
          echo "$OUTPUT"
          
          DIGEST="$(echo "$OUTPUT" | sed -nE 's/^Digest: (sha256:[a-f0-9]{64})$/\1/p')"
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not extract digest from helm push output"
            exit 1
          fi
          
          CHART_URI="${REPO}/${CHART_NAME}"
          echo "chart_uri=${CHART_URI}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA Provenance of Published OCI Chart
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.push.outputs.chart_uri }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign OCI Helm Chart (Cosign Keyless)
        env:
          SIGN_TARGET: "${{ steps.push.outputs.chart_uri }}@${{ steps.push.outputs.digest }}"
        run: |
          echo "Signing OCI Chart: $SIGN_TARGET"
          cosign sign --yes "$SIGN_TARGET"

      - name: Verify Chart Signature
        env:
          SIGN_TARGET: "${{ steps.push.outputs.chart_uri }}@${{ steps.push.outputs.digest }}"
        run: |
          echo "Verifying chart signature: $SIGN_TARGET"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY_OWNER}/.*" \
            "$SIGN_TARGET"
          echo "Chart signature verified successfully!"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/${CHART_NAME}-${{ steps.meta.outputs.version }}.tgz" \
            --title "Dify Sandbox Helm Chart v${{ steps.meta.outputs.version }}" \
            --generate-notes
